name: Build and Release Static Nano

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-static:
    name: Build Static Binary (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Static Nano inside Alpine
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace alpine sh -c "
            set -ex
            apk add --no-cache git alpine-sdk autoconf automake gettext-dev ncurses-dev ncurses-static texinfo python3 coreutils linux-headers
            git config --global --add safe.directory '*'
            ./autogen.sh
            ./configure LDFLAGS='-static -no-pie' --prefix=/usr/local
            make -j\$(nproc)
            strip -s src/nano
            
            # Prepare distribution bundle
            mkdir -p /workspace/dist/bin /workspace/dist/share/nano
            cp src/nano /workspace/dist/bin/nano
            cp syntax/*.nanorc /workspace/dist/share/nano/
            if [ -d syntax/extra ]; then
              mkdir -p /workspace/dist/share/nano/extra
              cp syntax/extra/*.nanorc /workspace/dist/share/nano/extra/
            fi
            
            cd /workspace/dist
            tar -czvf /workspace/nano-linux-${{ matrix.arch }}.tar.gz bin share
          "

      - name: Upload Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nano-linux-${{ matrix.arch }}
          path: nano-linux-${{ matrix.arch }}.tar.gz

  release:
    name: Publish Release
    needs: build-static
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          find artifacts -name "*.tar.gz" -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v9.2-custom' }}
          files: release-assets/*.tar.gz
          generate_release_notes: true
